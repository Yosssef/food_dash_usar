name: FoodDash CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java environment for Android build
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Get dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Analyze code for errors and warnings
      - name: Analyze Code
        run: flutter analyze

      # 6. Run all tests
      - name: Run Tests
        run: flutter test

      # 7. Build Android APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload Build Artifact (To download APK directly from GitHub Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk